<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Success</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }
        .success-card {
            width: min(100%, 500px);
            margin: 80px auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(31, 50, 79, 0.08);
            text-align: center;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #d4edda;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .success-card h1 {
            margin: 0 0 14px;
            font-size: 2rem;
            color: #155724;
            letter-spacing: -0.025em;
        }
        .success-card p {
            margin: 0 0 32px;
            color: #606c84;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        .button-group {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 14px 24px;
            border: none;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }
        .btn-primary {
            background: #0750f5;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #0039d1;
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(7, 80, 245, 0.26);
        }
        .btn-secondary {
            background: #e9ecef;
            color: #172b4d;
        }
        .btn-secondary:hover {
            background: #d3d8e0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">✓</div>
        <h1>Upload Successful!</h1>
        <p>Your file has been uploaded successfully.</p>
        <div class="button-group">
            <a href="{% url 'mediaapp:upload' %}" class="btn btn-primary">Upload Another File</a>
            <a href="{% url 'admin:mediaapp_mediafile_changelist' %}" class="btn btn-secondary">View All Files</a>
        </div>
    </div>
</body>
</html>
