<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }
        .upload-card {
            width: min(100%, 450px);
            margin: 70px auto;
            padding: 32px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(31, 50, 79, 0.08);
        }
        .upload-card h1 {
            margin: 0 0 18px;
            font-size: 1.9rem;
            letter-spacing: -0.025em;
        }
        .upload-card p {
            margin: 0 0 26px;
            color: #606c84;
            line-height: 1.7;
        }
        .field-group {
            margin-bottom: 22px;
        }
        .field-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .field-group input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9e2ef;
            border-radius: 14px;
            background: #f7f9fc;
            font-size: 1rem;
            color: #172b4d;
        }
        .field-group .error {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #d93f3f;
        }
        .upload-button {
            width: 100%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            border: none;
            border-radius: 999px;
            background: #0750f5;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }
        .upload-button:hover {
            background: #0039d1;
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(7, 80, 245, 0.26);
        }
    </style>
</head>
<body>
    <div class="upload-card">
        <h1>Upload File</h1>
        <p>Select a file to upload and submit the form below.</p>
        <form method="post" enctype="multipart/form-data" class="upload-form">
            {% csrf_token %}
            <div class="field-group">
                <label for="id_title">Title</label>
                {{ form.title }}
                {% if form.title.errors %}
                    <div class="error">{{ form.title.errors|striptags }}</div>
                {% endif %}
            </div>
            <div class="field-group">
                <label for="id_file">Choose file</label>
                {{ form.file }}
                {% if form.file.errors %}
                    <div class="error">{{ form.file.errors|striptags }}</div>
                {% endif %}
            </div>
            <button type="submit" class="upload-button">Upload File</button>
        </form>
    </div>
</body>
</html>
